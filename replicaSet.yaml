apiVersion: apps/v1
Kind: Replicaset
metadata:
  name: webapp
spec:
  selector:
    matchLabels:
      app: webbapp
  replicas: 2
  template: # template for the pods
    metadata:
      labels:
        app: webapp
     spec:
       containers:
         - name: webapp
           image: richardchesterwood/k8s:release0-5
  


